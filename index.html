<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #e5e7eb;
      --accent: #22c55e;
      --muted: #9ca3af;
    }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center;
      background: radial-gradient(1200px 600px at 20% 10%, #1f2937 0%, var(--bg) 40%, #0b1220 100%);
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      width: 92vw; max-width: 720px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 24px;
      box-shadow: 0 40px 120px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0 0 12px; font-size: 1.4rem; letter-spacing: 0.3px; }
    p { margin: 0 0 20px; color: var(--muted); }
    form { display: flex; gap: 10px; align-items: center; }
    .input {
      flex: 1; min-width: 0;
      background: #0b1220; color: var(--text);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 14px 16px; font-size: 1rem;
      outline: none;
    }
    .input::placeholder { color: #64748b; }
    .btn {
      background: var(--accent); color: #052e15;
      border: none; border-radius: 12px;
      padding: 12px 18px; font-weight: 600; cursor: pointer;
      box-shadow: 0 8px 24px rgba(34,197,94,0.35);
    }
    .helper { margin-top: 14px; font-size: 0.9rem; color: #7dd3fc; }
    .success {
      display: none; margin-top: 16px; padding: 12px 14px;
      border: 1px solid rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.08); border-radius: 12px; color: #86efac;
    }
    .hidden-hp { position: absolute; left: -9999px; opacity: 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Search</h1>
    <p>Type anything and hit Enter — we’ll receive it instantly.</p>

    <form action="https://getform.io/f/bllglddb" method="POST" accept-charset="utf-8">
      <!-- The actual search box -->
      <input
        type="search"
        name="search"
        class="input"
        placeholder="What are you looking for?"
        required
        autocomplete="off"
      />
      <button class="btn" type="submit">Send</button>

      <!-- Optional metadata to help identify the source -->
      <input type="hidden" name="page" value="github-pages-search" />
      <input type="hidden" name="timestamp" id="ts" value="" />

      <!-- Honeypot field (basic spam mitigation) -->
      <input type="text" name="_gotcha" class="hidden-hp" tabindex="-1" autocomplete="off" />
    </form>

    <div id="ok" class="success">Thank you — your search was sent.</div>
    <div class="helper">This form posts to a secure Getform endpoint.</div>
  </main>

  <script>
    // Stamp the submission time
    document.getElementById('ts').value = new Date().toISOString();

    // Progressive enhancement: show a success message after redirect-less submissions
    // If you set up a redirect at Getform, this block isn’t necessary.
    if (window.location.search.includes('success=true')) {
      document.getElementById('ok').style.display = 'block';
    }
  </script>
</body>
</html>
